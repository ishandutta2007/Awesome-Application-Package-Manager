<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .pill-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    
    /* Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    
    .glow-orb-1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 200px 100px; }
    .glow-orb-2 { animation: pulseGlow 8s ease-in-out infinite 2s; transform-origin: 1000px 300px; }
    .floating-card { animation: floatParticle 5s ease-in-out infinite; }
    .floating-card-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .flowing-line { stroke-dasharray: 8 8; animation: dashFlow 2s linear infinite; }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic Glowing Background Elements (Behind Content) -->
  <circle class="glow-orb-1" cx="200" cy="100" r="180" fill="#38bdf8" filter="url(#glow)" opacity="0.25"/>
  <circle class="glow-orb-2" cx="1000" cy="300" r="220" fill="#c084fc" filter="url(#glow)" opacity="0.25"/>

  <!-- Animated Connection / Flow Lines (Background Layer) -->
  <path d="M 150,300 C 300,350 450,250 600,320 C 750,390 900,280 1050,330" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3" class="flowing-line"/>
  <path d="M 100,100 C 300,50 500,180 700,80 C 900,20 1000,120 1100,70" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" class="flowing-line"/>

  <!-- Floating Dynamic Tech Cards (Semi-Transparent Background Accent) -->
  <g class="floating-card" opacity="0.4">
    <rect x="880" y="60" width="220" height="70" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="910" y="102" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="22">📦 NPM / PyPI</text>
  </g>
  <g class="floating-card-2" opacity="0.4">
    <rect x="80" y="270" width="240" height="70" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="110" y="312" fill="#c084fc" font-family="sans-serif" font-weight="bold" font-size="22">🐸 JFrog / Nexus</text>
  </g>

  <!-- MAIN FOREGROUND CONTENT (Always clear, layered on top) -->
  <g transform="translate(100, 140)">
    <!-- Badge Pill -->
    <rect x="0" y="0" width="240" height="34" rx="17" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="16" y="22" class="pill-text" fill="#38bdf8">🚀 Enterprise &amp; OSS Ecosystem</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title">
      Awesome Application <tspan fill="url(#accentGrad)">Package Manager</tspan> 📦
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle">
      Curated Registries, Universal Artifact Repositories &amp; Supply Chain Security
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 160)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="21" class="pill-text">🔒 Supply Chain</text>

      <!-- Tag 2 -->
      <rect x="175" y="0" width="180" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="190" y="21" class="pill-text">⚡ Artifact Storage</text>

      <!-- Tag 3 -->
      <rect x="370" y="0" width="170" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="385" y="21" class="pill-text">🌐 Universal Feeds</text>
    </g>
  </g>
</svg>
